title: Woodfrog Bread Health
description: |
  This project was created along with bakery staff at Woodfrog Bakery to monitor bread conditions during the baking process.

  It was designed to be used by bakery staff at the bakery, and allow for external monitoring by management.

  Built with Nuxt and Vue JS.
